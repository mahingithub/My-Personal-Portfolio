<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Portfolio Messages</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS RESET & VARIABLES ===== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-primary: #050510;
      --bg-secondary: #0c0c1d;
      --bg-card: #111128;
      --bg-card-hover: #16163a;
      --accent: #00eeff;
      --accent-glow: rgba(0, 238, 255, 0.15);
      --accent-dark: #0088aa;
      --danger: #ff4757;
      --danger-glow: rgba(255, 71, 87, 0.15);
      --success: #2ed573;
      --warning: #ffa502;
      --text-primary: #e8e8f0;
      --text-secondary: #8888aa;
      --text-muted: #555577;
      --border: #1a1a3e;
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-dark); }

    /* ===== LOGIN SCREEN ===== */
    .login-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: var(--bg-primary);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.5s, visibility 0.5s;
    }
    .login-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%; max-width: 420px;
      text-align: center;
      box-shadow: var(--shadow), 0 0 100px rgba(0, 238, 255, 0.05);
    }
    .login-card .lock-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--accent-glow);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px; color: var(--accent);
    }
    .login-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .login-card p { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; }

    .login-input-group {
      position: relative; margin-bottom: 20px;
    }
    .login-input-group input {
      width: 100%; padding: 14px 16px 14px 44px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-primary); font-size: 15px;
      font-family: inherit; transition: border-color 0.3s;
      outline: none;
    }
    .login-input-group input:focus { border-color: var(--accent); }
    .login-input-group i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 18px;
    }

    .login-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accent), #0066ff);
      color: var(--bg-primary); border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      text-transform: uppercase; letter-spacing: 1px;
      transition: transform 0.2s, box-shadow 0.3s;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 238, 255, 0.3); }
    .login-btn:active { transform: translateY(0); }

    .login-error {
      color: var(--danger); font-size: 13px; margin-top: 12px;
      display: none;
    }
    .login-error.show { display: block; }

    /* ===== MAIN LAYOUT ===== */
    .app { display: none; }
    .app.visible { display: block; }

    /* ===== TOP NAVBAR ===== */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(5, 5, 16, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .navbar-brand {
      display: flex; align-items: center; gap: 12px;
      font-size: 20px; font-weight: 800;
    }
    .navbar-brand i { color: var(--accent); font-size: 24px; }
    .navbar-brand span { color: var(--accent); }

    .navbar-actions { display: flex; align-items: center; gap: 12px; }

    .btn {
      padding: 10px 20px; border-radius: 8px; border: none;
      font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; display: inline-flex;
      align-items: center; gap: 6px;
    }
    .btn-outline {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--danger-glow); color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: white; }
    .btn-accent {
      background: linear-gradient(135deg, var(--accent), #0066ff);
      color: var(--bg-primary);
    }
    .btn-accent:hover { box-shadow: 0 4px 15px rgba(0, 238, 255, 0.3); transform: translateY(-1px); }

    /* ===== STATS BAR ===== */
    .stats-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; padding: 24px 32px;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 24px;
      display: flex; align-items: center; gap: 16px;
      transition: border-color 0.3s;
    }
    .stat-card:hover { border-color: var(--accent); }
    .stat-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    .stat-icon.blue { background: var(--accent-glow); color: var(--accent); }
    .stat-icon.green { background: rgba(46, 213, 115, 0.15); color: var(--success); }
    .stat-icon.orange { background: rgba(255, 165, 2, 0.15); color: var(--warning); }
    .stat-icon.red { background: var(--danger-glow); color: var(--danger); }

    .stat-info h3 { font-size: 28px; font-weight: 800; line-height: 1; }
    .stat-info p { font-size: 12px; color: var(--text-secondary); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }

    /* ===== TOOLBAR ===== */
    .toolbar {
      padding: 0 32px 16px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .search-box {
      position: relative; flex: 1; min-width: 240px;
    }
    .search-box input {
      width: 100%; padding: 12px 16px 12px 42px;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-primary); font-size: 14px;
      font-family: inherit; outline: none; transition: border-color 0.3s;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box i {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); font-size: 18px;
    }

    .filter-btn {
      padding: 10px 16px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 10px;
      color: var(--text-secondary); font-size: 13px; font-family: inherit;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .filter-btn:hover, .filter-btn.active { border-color: var(--accent); color: var(--accent); }

    /* ===== MESSAGES TABLE ===== */
    .messages-container { padding: 0 32px 32px; }

    .messages-table {
      width: 100%; border-collapse: separate; border-spacing: 0;
      background: var(--bg-card); border-radius: var(--radius);
      border: 1px solid var(--border); overflow: hidden;
    }
    .messages-table thead th {
      padding: 14px 20px; text-align: left;
      font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--text-muted); font-weight: 600;
      background: var(--bg-secondary); border-bottom: 1px solid var(--border);
    }
    .messages-table tbody tr {
      transition: background 0.2s; cursor: pointer;
    }
    .messages-table tbody tr:hover { background: var(--bg-card-hover); }
    .messages-table tbody tr.unread { border-left: 3px solid var(--accent); }
    .messages-table tbody td {
      padding: 16px 20px; font-size: 14px;
      border-bottom: 1px solid var(--border);
      max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .messages-table tbody tr:last-child td { border-bottom: none; }

    .badge-unread {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .badge-read {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: var(--text-muted);
    }

    .sender-info { display: flex; flex-direction: column; }
    .sender-name { font-weight: 600; }
    .sender-email { font-size: 12px; color: var(--text-secondary); }

    .msg-date { font-size: 12px; color: var(--text-secondary); }
    .msg-actions { display: flex; gap: 8px; }

    .icon-btn {
      width: 34px; height: 34px; border-radius: 8px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-secondary); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* ===== MESSAGE DETAIL MODAL ===== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px; width: 100%; max-width: 600px;
      max-height: 85vh; overflow-y: auto;
      box-shadow: var(--shadow), 0 0 80px rgba(0, 238, 255, 0.08);
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header {
      padding: 24px 28px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h3 { font-size: 18px; font-weight: 700; }

    .modal-body { padding: 28px; }
    .modal-field { margin-bottom: 24px; }
    .modal-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
      color: var(--accent); font-weight: 600; margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .modal-value {
      font-size: 15px; color: var(--text-primary);
      padding: 14px 16px; background: var(--bg-secondary);
      border-radius: 10px; border-left: 3px solid var(--accent);
      line-height: 1.7; white-space: pre-wrap; word-break: break-word;
    }
    .modal-value a { color: var(--accent); text-decoration: none; }
    .modal-value a:hover { text-decoration: underline; }

    .modal-footer {
      padding: 20px 28px; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; gap: 12px;
    }

    /* ===== EMPTY STATE ===== */
    .empty-state {
      text-align: center; padding: 80px 20px;
    }
    .empty-state i { font-size: 64px; color: var(--text-muted); margin-bottom: 16px; }
    .empty-state h3 { font-size: 20px; margin-bottom: 8px; }
    .empty-state p { color: var(--text-secondary); font-size: 14px; }

    /* ===== LOADING ===== */
    .loading {
      text-align: center; padding: 60px 20px; color: var(--text-secondary);
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== TOAST NOTIFICATIONS ===== */
    .toast-container {
      position: fixed; top: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: column; gap: 10px;
    }
    .toast {
      padding: 14px 20px; border-radius: 10px;
      font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
      animation: toastIn 0.3s ease;
      box-shadow: var(--shadow);
    }
    .toast.success { background: rgba(46, 213, 115, 0.15); color: var(--success); border: 1px solid rgba(46, 213, 115, 0.3); }
    .toast.error { background: var(--danger-glow); color: var(--danger); border: 1px solid rgba(255, 71, 87, 0.3); }
    .toast.info { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(0, 238, 255, 0.3); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(100px); } to { opacity: 1; transform: translateX(0); } }

    /* ===== PAGINATION ===== */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; padding: 24px;
    }
    .page-btn {
      width: 38px; height: 38px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg-card);
      color: var(--text-secondary); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .page-btn:hover { border-color: var(--accent); color: var(--accent); }
    .page-btn.active { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .navbar { padding: 12px 16px; }
      .stats-bar { padding: 16px; grid-template-columns: 1fr 1fr; }
      .toolbar { padding: 0 16px 12px; }
      .messages-container { padding: 0 16px 16px; }
      .messages-table thead { display: none; }
      .messages-table tbody tr { display: block; padding: 16px; margin-bottom: 8px; border-radius: 10px; }
      .messages-table tbody td { display: block; padding: 4px 0; border-bottom: none; max-width: 100%; }
      .modal { max-width: 100%; border-radius: 16px; }
      .login-card { padding: 36px 24px; margin: 0 16px; }
    }
  </style>
</head>
<body>

  <!-- ===== LOGIN SCREEN ===== -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <div class="lock-icon"><i class="bx bx-lock-alt"></i></div>
      <h2>Admin Access</h2>
      <p>Enter your admin password to manage messages</p>
      <div class="login-input-group">
        <i class="bx bx-key"></i>
        <input type="password" id="loginPassword" placeholder="Enter admin password" autofocus>
      </div>
      <button class="login-btn" id="loginBtn" onclick="handleLogin()">
        <i class="bx bx-log-in"></i> Unlock Dashboard
      </button>
      <p class="login-error" id="loginError">Invalid password. Please try again.</p>
    </div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <div class="app" id="mainApp">

    <!-- Navbar -->
    <nav class="navbar">
      <div class="navbar-brand">
        <i class="bx bx-envelope"></i>
        Portfolio <span>Messages</span>
      </div>
      <div class="navbar-actions">
        <button class="btn btn-outline" onclick="loadMessages()">
          <i class="bx bx-refresh"></i> Refresh
        </button>
        <button class="btn btn-outline" onclick="handleLogout()">
          <i class="bx bx-log-out"></i> Logout
        </button>
      </div>
    </nav>

    <!-- Stats -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="bx bx-envelope"></i></div>
        <div class="stat-info">
          <h3 id="totalCount">0</h3>
          <p>Total Messages</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon orange"><i class="bx bx-bell"></i></div>
        <div class="stat-info">
          <h3 id="unreadCount">0</h3>
          <p>Unread</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="bx bx-check-double"></i></div>
        <div class="stat-info">
          <h3 id="readCount">0</h3>
          <p>Read</p>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon red"><i class="bx bx-time-five"></i></div>
        <div class="stat-info">
          <h3 id="todayCount">0</h3>
          <p>Today</p>
        </div>
      </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-box">
        <i class="bx bx-search"></i>
        <input type="text" id="searchInput" placeholder="Search by name, email, or subject..." oninput="debounceSearch()">
      </div>
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">
        <i class="bx bx-list-ul"></i> All
      </button>
      <button class="filter-btn" data-filter="unread" onclick="setFilter('unread', this)">
        <i class="bx bx-bell"></i> Unread
      </button>
      <button class="filter-btn" data-filter="read" onclick="setFilter('read', this)">
        <i class="bx bx-check"></i> Read
      </button>
    </div>

    <!-- Messages Table -->
    <div class="messages-container">
      <div id="messagesContent">
        <div class="loading">
          <div class="spinner"></div>
          <p>Loading messages...</p>
        </div>
      </div>

      <!-- Pagination -->
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <!-- ===== MESSAGE DETAIL MODAL ===== -->
  <div class="modal-overlay" id="messageModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="bx bx-envelope-open" style="color: var(--accent);"></i> Message Details</h3>
        <button class="icon-btn" onclick="closeModal()"><i class="bx bx-x"></i></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="modalDeleteBtn">
          <i class="bx bx-trash"></i> Delete
        </button>
        <a class="btn btn-accent" id="modalReplyBtn" target="_blank">
          <i class="bx bx-reply"></i> Reply via Email
        </a>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ============================================
    // ⚙️ Configuration
    // ============================================
    const API_BASE = window.location.origin;
    let adminPassword = '';
    let currentPage = 1;
    let currentFilter = 'all';
    let searchQuery = '';
    let searchTimeout = null;

    // ============================================
    // 🔐 Authentication
    // ============================================
    function handleLogin() {
      const passwordInput = document.getElementById('loginPassword');
      const errorEl = document.getElementById('loginError');
      adminPassword = passwordInput.value.trim();

      if (!adminPassword) {
        errorEl.textContent = 'Please enter a password.';
        errorEl.classList.add('show');
        return;
      }

      // Test the password by making a request
      fetch(`${API_BASE}/api/messages?limit=1`, {
        headers: { 'x-admin-password': adminPassword },
      })
        .then((res) => {
          if (res.ok) {
            document.getElementById('loginOverlay').classList.add('hidden');
            document.getElementById('mainApp').classList.add('visible');
            sessionStorage.setItem('adminPassword', adminPassword);
            loadMessages();
          } else {
            errorEl.textContent = 'Invalid password. Please try again.';
            errorEl.classList.add('show');
            passwordInput.value = '';
            passwordInput.focus();
          }
        })
        .catch(() => {
          errorEl.textContent = 'Server connection failed. Is the backend running?';
          errorEl.classList.add('show');
        });
    }

    function handleLogout() {
      adminPassword = '';
      sessionStorage.removeItem('adminPassword');
      document.getElementById('loginOverlay').classList.remove('hidden');
      document.getElementById('mainApp').classList.remove('visible');
      document.getElementById('loginPassword').value = '';
    }

    // Auto-login if password in session
    (function checkSession() {
      const saved = sessionStorage.getItem('adminPassword');
      if (saved) {
        adminPassword = saved;
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('mainApp').classList.add('visible');
        loadMessages();
      }
    })();

    // Login on Enter key
    document.getElementById('loginPassword').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    // ============================================
    // 📨 Load Messages
    // ============================================
    async function loadMessages() {
      const contentEl = document.getElementById('messagesContent');
      contentEl.innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading messages...</p></div>';

      try {
        let url = `${API_BASE}/api/messages?page=${currentPage}&limit=15`;
        if (currentFilter === 'unread') url += '&isRead=false';
        if (currentFilter === 'read') url += '&isRead=true';
        if (searchQuery) url += `&search=${encodeURIComponent(searchQuery)}`;

        const res = await fetch(url, {
          headers: { 'x-admin-password': adminPassword },
        });

        if (!res.ok) throw new Error('Failed to fetch');

        const data = await res.json();
        const messages = data.data;
        const { pagination, unreadCount } = data;

        // Update stats
        document.getElementById('totalCount').textContent = pagination.total;
        document.getElementById('unreadCount').textContent = unreadCount;
        document.getElementById('readCount').textContent = pagination.total - unreadCount;

        // Count today's messages
        const today = new Date().toDateString();
        const todayMsgs = messages.filter((m) => new Date(m.createdAt).toDateString() === today).length;
        document.getElementById('todayCount').textContent = todayMsgs;

        if (messages.length === 0) {
          contentEl.innerHTML = `
            <div class="empty-state">
              <i class="bx bx-inbox"></i>
              <h3>No messages found</h3>
              <p>${searchQuery ? 'Try a different search term' : 'Your inbox is empty. Messages will appear here.'}</p>
            </div>`;
          document.getElementById('pagination').innerHTML = '';
          return;
        }

        // Render table
        let html = `
          <table class="messages-table">
            <thead>
              <tr>
                <th style="width:40px">Status</th>
                <th>Sender</th>
                <th>Subject</th>
                <th>Message</th>
                <th>Date</th>
                <th style="width:100px">Actions</th>
              </tr>
            </thead>
            <tbody>`;

        messages.forEach((msg) => {
          const date = new Date(msg.createdAt);
          const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
          const timeStr = date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

          html += `
            <tr class="${msg.isRead ? '' : 'unread'}" onclick="viewMessage('${msg._id}')">
              <td><span class="${msg.isRead ? 'badge-read' : 'badge-unread'}"></span></td>
              <td>
                <div class="sender-info">
                  <span class="sender-name">${escapeHtml(msg.name)}</span>
                  <span class="sender-email">${escapeHtml(msg.email || msg.phone || '')}</span>
                </div>
              </td>
              <td style="font-weight:${msg.isRead ? '400' : '600'}">${escapeHtml(msg.subject)}</td>
              <td style="color:var(--text-secondary)">${escapeHtml(msg.message.substring(0, 60))}${msg.message.length > 60 ? '...' : ''}</td>
              <td class="msg-date">${dateStr}<br>${timeStr}</td>
              <td class="msg-actions" onclick="event.stopPropagation()">
                <button class="icon-btn" onclick="toggleRead('${msg._id}')" title="${msg.isRead ? 'Mark unread' : 'Mark read'}">
                  <i class="bx ${msg.isRead ? 'bx-envelope' : 'bx-envelope-open'}"></i>
                </button>
                <button class="icon-btn danger" onclick="deleteMessage('${msg._id}')" title="Delete">
                  <i class="bx bx-trash"></i>
                </button>
              </td>
            </tr>`;
        });

        html += '</tbody></table>';
        contentEl.innerHTML = html;

        // Render pagination
        renderPagination(pagination);
      } catch (error) {
        contentEl.innerHTML = `
          <div class="empty-state">
            <i class="bx bx-error-circle" style="color:var(--danger)"></i>
            <h3>Connection Error</h3>
            <p>Could not connect to the server. Make sure the backend is running.</p>
          </div>`;
      }
    }

    // ============================================
    // 📄 Pagination
    // ============================================
    function renderPagination(pagination) {
      const el = document.getElementById('pagination');
      if (pagination.pages <= 1) { el.innerHTML = ''; return; }

      let html = `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i class="bx bx-chevron-left"></i></button>`;

      for (let i = 1; i <= pagination.pages; i++) {
        if (i === 1 || i === pagination.pages || Math.abs(i - currentPage) <= 2) {
          html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        } else if (Math.abs(i - currentPage) === 3) {
          html += `<span style="color:var(--text-muted)">…</span>`;
        }
      }

      html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === pagination.pages ? 'disabled' : ''}><i class="bx bx-chevron-right"></i></button>`;

      el.innerHTML = html;
    }

    function goToPage(page) { currentPage = page; loadMessages(); }

    // ============================================
    // 🔍 Search & Filter
    // ============================================
    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchQuery = document.getElementById('searchInput').value.trim();
        currentPage = 1;
        loadMessages();
      }, 400);
    }

    function setFilter(filter, btnEl) {
      currentFilter = filter;
      currentPage = 1;
      document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
      btnEl.classList.add('active');
      loadMessages();
    }

    // ============================================
    // 👁️ View Message (Modal)
    // ============================================
    async function viewMessage(id) {
      try {
        const res = await fetch(`${API_BASE}/api/messages/${id}`, {
          headers: { 'x-admin-password': adminPassword },
        });
        const data = await res.json();
        const msg = data.data;

        const date = new Date(msg.createdAt).toLocaleString();

        document.getElementById('modalBody').innerHTML = `
          <div class="modal-field">
            <div class="modal-label"><i class="bx bx-user"></i> Name</div>
            <div class="modal-value">${escapeHtml(msg.name)}</div>
          </div>
          ${msg.email ? `
          <div class="modal-field">
            <div class="modal-label"><i class="bx bx-envelope"></i> Email</div>
            <div class="modal-value"><a href="mailto:${escapeHtml(msg.email)}">${escapeHtml(msg.email)}</a></div>
          </div>` : ''}
          ${msg.phone ? `
          <div class="modal-field">
            <div class="modal-label"><i class="bx bx-phone"></i> Phone / WhatsApp</div>
            <div class="modal-value">${escapeHtml(msg.phone)} · <a href="${whatsappLink(msg.phone)}" target="_blank" rel="noopener">WhatsApp</a> · <a href="tel:${escapeHtml(msg.phone.replace(/[^\d+]/g, ''))}">Call</a></div>
          </div>` : ''}
          <div class="modal-field">
            <div class="modal-label"><i class="bx bx-edit"></i> Subject</div>
            <div class="modal-value">${escapeHtml(msg.subject)}</div>
          </div>
          <div class="modal-field">
            <div class="modal-label"><i class="bx bx-message-detail"></i> Message</div>
            <div class="modal-value">${escapeHtml(msg.message)}</div>
          </div>
          <div class="modal-field">
            <div class="modal-label"><i class="bx bx-calendar"></i> Received</div>
            <div class="modal-value">${date}</div>
          </div>`;

        document.getElementById('modalDeleteBtn').onclick = () => { closeModal(); deleteMessage(id); };
        // Reply by email when there is one, otherwise on WhatsApp.
        const replyButton = document.getElementById('modalReplyBtn');
        replyButton.href = msg.email ? `mailto:${msg.email}?subject=Re: ${encodeURIComponent(msg.subject)}` : whatsappLink(msg.phone);
        replyButton.target = msg.email ? '' : '_blank';

        document.getElementById('messageModal').classList.add('show');

        // Refresh list to update read status
        loadMessages();
      } catch (error) {
        showToast('Failed to load message', 'error');
      }
    }

    function closeModal() {
      document.getElementById('messageModal').classList.remove('show');
    }

    document.getElementById('messageModal').addEventListener('click', (e) => {
      if (e.target.classList.contains('modal-overlay')) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // ============================================
    // ✏️ Toggle Read Status
    // ============================================
    async function toggleRead(id) {
      try {
        await fetch(`${API_BASE}/api/messages/${id}/read`, {
          method: 'PATCH',
          headers: { 'x-admin-password': adminPassword },
        });
        loadMessages();
      } catch (error) {
        showToast('Failed to update', 'error');
      }
    }

    // ============================================
    // 🗑️ Delete Message
    // ============================================
    async function deleteMessage(id) {
      if (!confirm('Are you sure you want to delete this message?')) return;

      try {
        const res = await fetch(`${API_BASE}/api/messages/${id}`, {
          method: 'DELETE',
          headers: { 'x-admin-password': adminPassword },
        });

        if (res.ok) {
          showToast('Message deleted successfully', 'success');
          loadMessages();
        } else {
          showToast('Failed to delete message', 'error');
        }
      } catch (error) {
        showToast('Server error', 'error');
      }
    }

    // ============================================
    // 🔔 Toast Notifications
    // ============================================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;

      const icons = { success: 'bx-check-circle', error: 'bx-error-circle', info: 'bx-info-circle' };
      toast.innerHTML = `<i class="bx ${icons[type]}"></i> ${message}`;

      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    // ============================================
    // 🛡️ Utility
    // ============================================
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // WhatsApp chat link; local Bangladeshi numbers (01…) get the 880 country code.
    function whatsappLink(phone) {
      const digits = String(phone || '').replace(/\D/g, '');
      return `https://wa.me/${digits.startsWith('0') ? `88${digits}` : digits}`;
    }
  </script>
</body>
</html>
