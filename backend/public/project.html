  <script>
    (function (root) {
      root.classList.add('js');
      // Page transition: the page you came from leaves a note, so this one can reveal itself (see js/script.js).
      try {
        var note = JSON.parse(sessionStorage.getItem('pt'));
        sessionStorage.removeItem('pt');
        if (note && Date.now() - note.at < 4000 && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          root.classList.add('pt-in');
          root.dataset.ptLabel = String(note.label || '');
          if (/^#[\da-f]{3,8}$/i.test(note.color)) root.style.setProperty('--pt-color', note.color);
        }
      } catch (error) {}
    })(document.documentElement);
  </script>
